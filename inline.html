<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <form>
            <h1>Login</h1><br><br>
            <div>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" placeholder="Enter your user name"><br><br><br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="Enter password"><br><br><br><br><br>
            <button type="submit">LOGIN</button></div>

        </form>
    </div>
    
</body>
</html>
