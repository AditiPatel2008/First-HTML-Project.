<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Form</title>
</head>
<body>
     <form>
        <h1>University Registration Form</h1>
        <p>Please fill out the form below to register.</p><hr>
        <h2>Personal Details</h2>
        <label for="firstname">First Name :</label>
        <input type="text" name="firstname" id="firstname"><br><br>
        <label for="lastname">Last Name :</label>
        <input type="text" name="lastname" id="lastname"><br><br>
        <label for="dob">Date of Birth :</label>
        <input type="date" name="dob" id="dob"><br>
        <h4>Gender:</h4>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="Male"><br>
        <label for="female">Male</label>
        <input type="radio" name="gender" id="female" value="Female"><br>
        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other"><br><br>
        <label fot="photo">Upload Your Photo :</label><br>
        <input type="file" name="file" id="photo"><hr>
        <h2>Contact Information </h2>
        <label for="email">Email Address :</label>
        <input type="email" name="emailaddress" id="email"><br><br>
        <label for="phonenumber">Phone Number :</label>
        <input type="tel" name="phonenumber" id="phonenumber"><br><br>
        <label for="mailingaddress">Mailing Address :</label><br>
        <textarea name="mailingaddress" id="mailingaddress" rows="5px" column="10px"></textarea><hr>
        <h2>Academic Information</h2>
        <label for="course">Select Your Course :</label>
        <select name="course" id="course">
            <option value="select">Select</option>
            <object value="cse">CSE</object>
            <option value="ce">CE</option>
            <option value="me">ME</option>
        </select>
        <h4>Extracurricular Interests :</h4>
        <label for="sports">Sports</label>
        <input type="checkbox" name="sports" id="sports"><br>
        <label for="music&arts">Music & Arts</label>
        <input type="checkbox" name="music&arts" id="music&arts"><br>
        <label for="technology club">Technology Clubs</label>
        <input type="checkbox" name="technology club" id="technology club"><br>
        <label for="volunteering">Volunteering</label>
        <input type="checkbox" name="volunteering" id="volunteering"><br> <hr> 
        <h2>Create Your Account</h2>
        <label for="password">Create a Password :</label>
        <input type="password" name="password" id="password"><br><br>
        <label for="security question">Security Question :</label>
        <select name="security question" id="security question">
            <option value="pet name">What was your first pet's name ?</option>
            <option value="orry">Orry</option>
            <option value="jerry">Jerry</option>
        </select><br><br>
        <label for="security answer">Security Answer :</label>
        <input type="text" nmae="security answer" id="security answer"><br><br>
        <input type="checkbox">
        <label for="agreement">I agree to the Terms and Conditionns.</label><br><br><hr><br>
        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>





     </form>
</body>
</html>
